<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Bible Projector — Пульт</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #181c24;
            color: #dde2ee;
            min-height: 100vh;
            padding-bottom: 30px;
        }
        header {
            position: sticky; top: 0; z-index: 10;
            background: #1c2130;
            padding: 12px 14px;
            border-bottom: 1px solid #343b4f;
        }
        .header-row { display: flex; gap: 8px; align-items: center; }
        #backBtn {
            flex-shrink: 0; display: none;
            padding: 9px 14px; border: none; border-radius: 8px;
            background: #2d3347; color: #dde2ee; font-size: 15px;
        }
        #searchInput {
            flex: 1; padding: 10px 12px;
            border: 1px solid #3e4660; border-radius: 8px;
            background: #242937; color: #dde2ee; font-size: 16px;
            outline: none;
        }
        #crumb { font-size: 13px; color: #8b93a8; margin-top: 8px; min-height: 16px; }
        main { padding: 12px; }

        /* Сітка "кубиків", як в основній версії */
        .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
        .grid button {
            aspect-ratio: 1 / 1;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px;
            padding: 2px; border: none; border-radius: 10px;
            background: #2d3347; color: #dde2ee; font-size: 13px; font-weight: 600;
            overflow: hidden;
        }
        .grid button:active { background: #007bff; color: #fff; }
        /* Книги: повна назва над скороченням */
        .grid.books-grid.full-names button { aspect-ratio: unset; min-height: 54px; padding: 5px 3px; }
        .book-full {
            display: block; font-size: 8px; font-weight: 500; opacity: 0.65;
            line-height: 1.2; word-break: break-word; overflow: hidden; max-height: 2.4em;
            text-align: center;
        }

        /* Кольори категорій книг (перевизначаються з налаштувань програми) */
        :root {
            --c-pentateuch: #FFDDC1; --c-historical: #CCE5FF; --c-poetic: #D4EDDA;
            --c-prophetic: #FFF3CD; --c-gospels: #F8D7DA; --c-acts: #E2E3E5;
            --c-epistles: #D6D8EC; --c-revelation: #F0E68C;
        }
        .cat-pentateuch { background: var(--c-pentateuch) !important; color: #333 !important; }
        .cat-historical { background: var(--c-historical) !important; color: #333 !important; }
        .cat-poetic { background: var(--c-poetic) !important; color: #333 !important; }
        .cat-prophetic { background: var(--c-prophetic) !important; color: #333 !important; }
        .cat-gospels { background: var(--c-gospels) !important; color: #333 !important; }
        .cat-acts { background: var(--c-acts) !important; color: #333 !important; }
        .cat-epistles { background: var(--c-epistles) !important; color: #333 !important; }
        .cat-revelation { background: var(--c-revelation) !important; color: #333 !important; }

        .verse-item {
            display: flex; gap: 10px; padding: 11px 10px;
            border: 1px solid #2a3040; border-radius: 10px; margin-bottom: 6px;
            font-size: 15px; line-height: 1.45;
        }
        .verse-item:active, .verse-item.sent { background: rgba(0,123,255,0.18); border-color: #007bff; }
        .verse-num { color: #4da3ff; font-weight: 700; flex-shrink: 0; min-width: 22px; }
        .result-ref { color: #4da3ff; font-weight: 600; font-size: 13px; display: block; margin-bottom: 2px; }
        .status { text-align: center; color: #8b93a8; padding: 30px 10px; font-size: 14px; }

        #toast {
            position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%);
            background: #16a34a; color: #fff; padding: 10px 18px; border-radius: 10px;
            font-size: 15px; opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 30;
            white-space: nowrap;
        }
        #toast.visible { opacity: 1; }
        #toast.error { background: #dc3545; }
    </style>
</head>
<body>
    <header>
        <div class="header-row">
            <button id="backBtn">←</button>
            <input type="text" id="searchInput" placeholder="Пошук: назва книги або текст вірша">
        </div>
        <div id="crumb"></div>
    </header>
    <main id="content"><div class="status">Завантаження…</div></main>

    <div id="toast"></div>

    <script>
        const content = document.getElementById('content');
        const crumb = document.getElementById('crumb');
        const backBtn = document.getElementById('backBtn');
        const searchInput = document.getElementById('searchInput');
        const toast = document.getElementById('toast');

        let books = [];
        let showFullNames = true;
        let view = 'books'; // books | chapters | verses | results
        let curBook = null;
        let curChapter = null;
        let searchTimer = null;
        let toastTimer = null;
        let sending = false; // Захист від подвійного тапу

        function showToast(msg, isError) {
            toast.textContent = msg;
            toast.classList.toggle('error', !!isError);
            toast.classList.add('visible');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('visible'), 1800);
        }

        async function api(path) {
            const res = await fetch(path);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
        }

        // Тап по віршу одразу надсилає пропозицію оператору
        async function propose(el, data) {
            if (sending) return;
            sending = true;
            el.classList.add('sent');
            try {
                const res = await fetch('/api/propose', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        bookId: data.bookId,
                        chapter: data.chapter,
                        versesStr: String(data.verse),
                        reference: `${data.shortName} ${data.chapter}:${data.verse}`,
                        text: data.text
                    })
                });
                if (!res.ok) throw new Error();
                showToast(`Надіслано: ${data.shortName} ${data.chapter}:${data.verse} ✓`);
            } catch (e) {
                showToast('Не вдалося надіслати', true);
            } finally {
                setTimeout(() => { el.classList.remove('sent'); sending = false; }, 600);
            }
        }

        function buildBooksGrid(list) {
            const grid = document.createElement('div');
            grid.className = 'grid books-grid' + (showFullNames ? ' full-names' : '');
            list.forEach(b => {
                const btn = document.createElement('button');
                if (b.category) btn.classList.add('cat-' + b.category);
                if (showFullNames) {
                    const full = document.createElement('span');
                    full.className = 'book-full';
                    full.textContent = b.long_name;
                    btn.appendChild(full);
                }
                const short = document.createElement('span');
                short.textContent = b.short_name;
                btn.appendChild(short);
                btn.onclick = () => { searchInput.value = ''; showChapters(b); };
                grid.appendChild(btn);
            });
            return grid;
        }

        function showBooks() {
            view = 'books';
            curBook = null; curChapter = null;
            backBtn.style.display = 'none';
            crumb.textContent = 'Оберіть книгу';
            content.innerHTML = '';
            content.appendChild(buildBooksGrid(books));
        }

        async function showChapters(book) {
            view = 'chapters';
            curBook = book;
            backBtn.style.display = 'block';
            crumb.textContent = book.long_name + ' — оберіть розділ';
            content.innerHTML = '<div class="status">Завантаження…</div>';
            try {
                const chapters = await api('/api/chapters?bookId=' + book.id);
                const grid = document.createElement('div');
                grid.className = 'grid';
                chapters.forEach(ch => {
                    const btn = document.createElement('button');
                    btn.textContent = ch;
                    btn.onclick = () => showVerses(book, ch);
                    grid.appendChild(btn);
                });
                content.innerHTML = '';
                content.appendChild(grid);
            } catch (e) {
                content.innerHTML = '<div class="status">Помилка завантаження</div>';
            }
        }

        async function showVerses(book, chapter) {
            view = 'verses';
            curBook = book; curChapter = chapter;
            backBtn.style.display = 'block';
            crumb.textContent = `${book.long_name} ${chapter} — тапніть вірш, щоб запропонувати`;
            content.innerHTML = '<div class="status">Завантаження…</div>';
            try {
                const verses = await api(`/api/chapter-text?bookId=${book.id}&chapter=${chapter}`);
                content.innerHTML = '';
                verses.forEach(v => {
                    const item = document.createElement('div');
                    item.className = 'verse-item';
                    item.innerHTML = `<span class="verse-num">${v.verse}</span><span>${escapeHtml(v.text)}</span>`;
                    item.onclick = () => propose(item, {
                        bookId: book.id, chapter, verse: v.verse, text: v.text, shortName: book.short_name
                    });
                    content.appendChild(item);
                });
            } catch (e) {
                content.innerHTML = '<div class="status">Помилка завантаження</div>';
            }
        }

        function escapeHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        async function doSearch(q) {
            view = 'results';
            backBtn.style.display = 'block';
            crumb.textContent = 'Результати пошуку — тапніть вірш, щоб запропонувати';
            content.innerHTML = '<div class="status">Пошук…</div>';
            try {
                const results = await api('/api/search?q=' + encodeURIComponent(q));
                if (results.length === 0) {
                    content.innerHTML = '<div class="status">Нічого не знайдено</div>';
                    return;
                }
                content.innerHTML = '';
                results.forEach(r => {
                    const item = document.createElement('div');
                    item.className = 'verse-item';
                    item.innerHTML = `<span><span class="result-ref">${escapeHtml(r.shortName)} ${r.chapter}:${r.verse}</span>${escapeHtml(r.text)}</span>`;
                    item.onclick = () => propose(item, {
                        bookId: r.bookId, chapter: r.chapter, verse: r.verse, text: r.text, shortName: r.shortName
                    });
                    content.appendChild(item);
                });
            } catch (e) {
                content.innerHTML = '<div class="status">Помилка пошуку</div>';
            }
        }

        // Пошук: одне слово — фільтр книг, 2+ слова — пошук по тексту
        searchInput.addEventListener('input', () => {
            const q = searchInput.value.trim();
            clearTimeout(searchTimer);
            if (!q) { showBooks(); return; }
            if (/\S+\s+\S/.test(q)) {
                searchTimer = setTimeout(() => doSearch(q), 450);
                return;
            }
            view = 'books';
            backBtn.style.display = 'block';
            crumb.textContent = 'Оберіть книгу';
            const ql = q.toLowerCase();
            const filtered = books.filter(b =>
                b.short_name.toLowerCase().startsWith(ql) || b.long_name.toLowerCase().startsWith(ql));
            content.innerHTML = filtered.length ? '' : '<div class="status">Книгу не знайдено</div>';
            if (filtered.length) content.appendChild(buildBooksGrid(filtered));
        });

        backBtn.addEventListener('click', () => {
            searchInput.value = '';
            if (view === 'verses') showChapters(curBook);
            else showBooks();
        });

        // Старт: список книг + кольори категорій з налаштувань програми
        (async () => {
            try {
                const data = await api('/api/books');
                books = data.books || [];
                showFullNames = data.showFullBookName !== false;
                if (data.categoryColors) {
                    for (const cat in data.categoryColors) {
                        document.documentElement.style.setProperty('--c-' + cat, data.categoryColors[cat]);
                    }
                }
                showBooks();
            } catch (e) {
                content.innerHTML = '<div class="status">Немає зв\'язку з програмою.<br>Перевірте, що комп\'ютер увімкнений і ви в одній Wi-Fi мережі.</div>';
            }
        })();
    </script>
</body>
</html>
