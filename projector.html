<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Проектор</title>
    <link rel="stylesheet" href="projector.css">
</head>
<body>
    <div id="verse-container" class="verse-container" style="display: none;">
        <div class="content-wrapper">
            <div id="verse-text" class="verse-text"></div>
            <div id="secondary-divider" class="secondary-divider" style="display: none;"></div>
            <div id="secondary-text" class="verse-text verse-text--secondary" style="display: none;"></div>
            <div id="verse-reference" class="verse-reference"></div>
        </div>
    </div>

    <script>
        const verseContainer = document.getElementById('verse-container');
        const verseTextElement = document.getElementById('verse-text');
        const secondaryTextElement = document.getElementById('secondary-text');
        const secondaryDivider = document.getElementById('secondary-divider');
        const verseReferenceElement = document.getElementById('verse-reference');
        const contentWrapper = verseContainer.querySelector('.content-wrapper');

        // Базовий («ідеальний») розмір шрифту вірша та посилання у vw
        const BASE_TEXT_VW = 5;
        const BASE_REFERENCE_VW = 3;
        const MIN_TEXT_PX = 16; // Нижче не опускаємось, щоб текст лишався читабельним

        // Перевіряємо, чи виходить контент за межі вікна проектора
        function isOverflowing() {
            return (
                contentWrapper.scrollHeight > contentWrapper.clientHeight ||
                contentWrapper.scrollWidth > contentWrapper.clientWidth
            );
        }

        // Підбираємо розмір шрифту так, щоб вірш(і) повністю влазили.
        // Якщо все влазить за базового розміру — нічого не зменшуємо.
        function fitVerseText() {
            const vw = window.innerWidth / 100;
            const baseTextPx = BASE_TEXT_VW * vw;
            const baseReferencePx = BASE_REFERENCE_VW * vw;
            const refRatio = baseReferencePx / baseTextPx; // зберігаємо пропорцію посилання

            const applyFontSize = (px) => {
                verseTextElement.style.fontSize = px + 'px';
                secondaryTextElement.style.fontSize = px + 'px';
                verseReferenceElement.style.fontSize = (px * refRatio) + 'px';
            };

            // Спочатку пробуємо базовий розмір
            applyFontSize(baseTextPx);
            if (!isOverflowing()) {
                return; // Все влазить — нічого не міняємо
            }

            // Бінарний пошук найбільшого розміру, за якого текст влазить
            let low = MIN_TEXT_PX;
            let high = baseTextPx;
            let best = MIN_TEXT_PX;
            for (let i = 0; i < 20 && high - low > 0.5; i++) {
                const mid = (low + high) / 2;
                applyFontSize(mid);
                if (isOverflowing()) {
                    high = mid;
                } else {
                    best = mid;
                    low = mid;
                }
            }
            applyFontSize(best);
        }

        // Слухаємо дані, що надходять від головного процесу
        window.electronAPI.onDisplayVerse((data) => {
            // data can be an object {text, reference, secondaryText} or an empty string
            if (typeof data === 'object' && data.text) {
                verseTextElement.innerText = data.text;
                verseReferenceElement.innerText = data.reference;

                // Другий (паралельний) переклад
                if (data.secondaryText) {
                    secondaryTextElement.innerText = data.secondaryText;
                    secondaryTextElement.style.display = 'block';
                    secondaryDivider.style.display = 'block';
                } else {
                    secondaryTextElement.innerText = '';
                    secondaryTextElement.style.display = 'none';
                    secondaryDivider.style.display = 'none';
                }

                verseContainer.style.display = 'flex';
                fitVerseText();
            } else {
                verseContainer.style.display = 'none';
            }
        });

        // Переобраховуємо при зміні розміру вікна проектора
        window.addEventListener('resize', () => {
            if (verseContainer.style.display !== 'none' && verseTextElement.innerText) {
                fitVerseText();
            }
        });

        // Слухаємо оновлення налаштувань
        window.electronAPI.onSettingsUpdated((settings) => {
            // Оновлення кольору фону
            if (settings.hasOwnProperty('backgroundColor')) {
                document.body.style.backgroundColor = settings.backgroundColor;
            }

            // Оновлення фонового зображення
            if (settings.hasOwnProperty('backgroundImage')) {
                if (settings.backgroundImage) {
                    // Потрібно правильно екранувати шлях для CSS
                    const imageUrl = settings.backgroundImage.replace(/\\/g, '/');
                    document.body.style.backgroundImage = `url('${imageUrl}')`;
                    document.body.style.backgroundSize = 'cover';
                    document.body.style.backgroundPosition = 'center';
                    document.body.style.backgroundRepeat = 'no-repeat';
                } else {
                    document.body.style.backgroundImage = 'none';
                }
            }
        });
    </script>
</body>
</html>
